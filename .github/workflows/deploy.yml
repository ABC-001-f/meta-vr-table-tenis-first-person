name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Node major as development: runs the .ts tests and server directly
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          node -v
          npm test 2>&1 | tee test.log
      # surface failures as annotations (readable without signing in)
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          grep -nE "not ok|Error|error:|expected|actual|failed" test.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
      # Pages serves from /<repo>/, so build with a relative base
      - run: npx tsc --noEmit
      - run: npx vite build --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
